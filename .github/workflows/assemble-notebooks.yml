name: Assemble notebooks

on:
  push:
    paths:
      - '.upload_chunks/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and validate notebooks
        shell: bash
        run: |
          mkdir -p notebooks
          cat .upload_chunks/preprocessing.part.* | base64 --decode > notebooks/01_eda_preprocessing_raw_enriched.ipynb
          cat .upload_chunks/modeling.part.* | base64 --decode > notebooks/02_train_evaluate_rankers.ipynb
          python - <<'PY'
          import json
          paths = [
              'notebooks/01_eda_preprocessing_raw_enriched.ipynb',
              'notebooks/02_train_evaluate_rankers.ipynb',
          ]
          for path in paths:
              with open(path, encoding='utf-8') as handle:
                  notebook = json.load(handle)
              assert notebook.get('nbformat') == 4, path
              print(path, 'cells=', len(notebook.get('cells', [])))
          PY

      - name: Commit notebooks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Add project notebooks'
            git push
          fi
